# DELUS — nginx. setup.sh ин файлро ба /etc/nginx/sites-available/delus мегузорад ва DOMAIN-ро иваз мекунад.
# Бо ҳамаи ҳолатҳои Cloudflare кор мекунад: DNS only, Flexible, Full ва Full (strict).

# IP-и аслии корбар аз паси Cloudflare (барои маҳдудияти кӯшиши воридшавӣ)
include /etc/nginx/snippets/delus-cloudflare.conf;
real_ip_header CF-Connecting-IP;

# Cloudflare Flexible: браузер бо https, Cloudflare ба сервер бо http меояд — он вақт масир намегардонем
map $http_cf_visitor $delus_cf_https { default 0; ~*"https" 1; }
map $delus_cf_https $delus_proto { 1 https; default $scheme; }

upstream delus_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name DOMAIN www.DOMAIN _;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        if ($delus_cf_https = 0) { return 301 https://DOMAIN$request_uri; }
        proxy_pass http://delus_app;
        include /etc/nginx/snippets/delus-proxy.conf;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name DOMAIN www.DOMAIN _;

    ssl_certificate     CERT_DIR/fullchain.pem;
    ssl_certificate_key CERT_DIR/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:delus:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://delus_app;
        include /etc/nginx/snippets/delus-proxy.conf;
    }
}
