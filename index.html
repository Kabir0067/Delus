    <!-- Лавҳаи боркунӣ -->
    <div id="boot" class="boot" aria-label="Боркунӣ"><span class="boot-mark"><svg class="ic" width="26" height="26">
                <use href="#i-logo"></use>
            </svg></span></div>

    <!-- Воридшавӣ -->
    <div id="login" class="login" hidden>
        <form id="loginForm" class="login-card" autocomplete="on" novalidate>
            <span class="brand-mark lg"><svg class="ic" width="24" height="24">
                    <use href="#i-logo"></use>
                </svg></span>
            <h1>DELUS</h1>
            <p class="login-sub">Идораи мол ва савдо</p>

            <label class="field">
                <span class="field-l">Логин</span>
                <input id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none"
                    spellcheck="false" required>
            </label>
            <label class="field">
                <span class="field-l">Парол</span>
                <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
            </label>

            <p id="loginError" class="form-err" role="alert" hidden></p>
            <button type="submit" id="loginBtn" class="btn primary block lg">Ворид шудан</button>
        </form>
    </div>

    <!-- Барнома -->
    <div id="app" class="app" hidden>
        <aside class="side">
            <div class="side-brand">
                <span class="brand-mark"><svg class="ic" width="17" height="17">
                        <use href="#i-logo"></use>
                    </svg></span>
                <span><b id="brandName">DELUS</b><small>Анбор ва савдо</small></span>
            </div>
            <nav id="sideNav" class="side-nav" aria-label="Менюи асосӣ"></nav>
            <div class="side-foot">
                <div class="side-user">
                    <span class="avatar"><svg class="ic" width="15" height="15">
                            <use href="#i-user"></use>
                        </svg></span>
                    <span id="userName" class="side-user-n"></span>
                </div>
                <button class="icon-btn" data-act="logout" aria-label="Баромадан" title="Баромадан"><svg class="ic"
                        width="18" height="18">
                        <use href="#i-out"></use>
                    </svg></button>
            </div>
        </aside>

        <div class="main">
            <header class="top">
                <div class="top-l">
                    <h1 id="pageTitle"></h1>
                    <p id="pageSub"></p>
                </div>
                <div class="top-r">
                    <button id="syncBtn" class="icon-btn" data-act="sync" aria-label="Навсозӣ аз ҷадвал"
                        title="Навсозӣ аз ҷадвал"><svg class="ic" width="18" height="18">
                            <use href="#i-sync"></use>
                        </svg></button>
                    <button class="icon-btn only-phone" data-act="go" data-page="set" aria-label="Танзимот" title="Танзимот"><svg class="ic" width="18" height="18"><use href="#i-gear"></use></svg></button>
                    <button class="btn sale-solid" data-act="sale"><svg class="ic" width="17" height="17">
                            <use href="#i-sale"></use>
                        </svg><span>Фурӯш</span></button>
                </div>
            </header>
            <div id="banner"></div>
            <main id="view" class="view"></main>
        </div>

        <button class="fab" data-act="sale"><svg class="ic" width="20" height="20"><use href="#i-sale"></use></svg>Фурӯш</button>
        <nav id="tabNav" class="tabbar" aria-label="Менюи асосӣ"></nav>
    </div>

    <div id="modals"></div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
</body>

</html>
